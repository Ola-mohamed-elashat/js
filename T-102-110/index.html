<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .popup {
    width: 540px;
    height: 140px;
    background-color: #f5f5f5;
    border: 1px solid #ddd;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    padding-top: 30px;
}

.popup h2 {
    margin: 10px 0 20px;
}

.popup p {
    margin: 0;
}

.close {
    width: 30px;
    height: 30px;
    background-color: red;
    color: white;
    border-radius: 50%;
    position: absolute;
    right: -14px;
    top: -14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    cursor: pointer;
}
</style>

 <script src="main.js"></script>
</body>
</html>
