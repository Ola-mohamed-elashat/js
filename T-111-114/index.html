<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link href="https://fonts.googleapis.com/css2?family=Cairo&family=Open+Sans&family=Roboto&display=swap"
    rel="stylesheet">

<body>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eee;
        }

        .container {
            width: 500px;
            margin: 20px auto;
        }

        .form {
            background-color: #fff;
            padding: 20px;
            border-radius: 6px;
            display: flex;
            text-align: center;
        }

        .input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            flex: 1;
            margin-right: 10px;
            outline: none;
        }

        .add {
            border: none;
            background-color: #f44336;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .tasks {
            background-color: #fff;
            margin-top: 20px;
            border-radius: 6px;
            padding: 20px;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #eee;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .task .del {
            background-color: red;
            color: white;
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .form-label {
            display: flex;
            align-items: center;
        }
    </style>
    <select id="font" title="choose font">
        <option>Open Sans</option>
        <option>Cairo</option>
        <option>Roboto</option>
    </select>
    <select id="color" title="choose color">
        <option>red</option>
        <option>black</option>
        <option>green</option>
        <option>blue</option>
        <option>orange</option>
        <option>Purple</option>
    </select>
    <select id="size" title="Choose Font Size">
        <option>16</option>
        <option>17</option>
        <option>18</option>
        <option>19</option>
        <option>20</option>
        <option>21</option>
        <option>22</option>
        <option>23</option>
        <option>24</option>
        <option>25</option>
        <option>26</option>
        <option>27</option>
        <option>28</option>
        <option>29</option>
        <option>30</option>
    </select>
    <p id="text">Welcome To Elzero</p>
    <!-- task2 -->
    <form>
        <input type="text" id="name" placeholder="Name">
        <input type="email" id="email" placeholder="Email">
        <input type="number" id="age" placeholder="Age">
        <select name="country" id="country" title="country">
            <option value="Egypt">Egypt</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="UAE">UAE</option>
            <option value="Qatar">Qatar</option>
            <option value="Kuwait">Kuwait</option>
        </select>
    </form>
    <div class="container">
        <form class="form">
                <label clas="form-label" for="input">Task:</label>
                <input name="input" id="input" type="text" class="input" />
            <button type="submit" class="add" value="Add Task">
                submit
            </button>
        </form>
        <div class="tasks"></div>
    </div>
    <script src="main.js"></script>
</body>

</html>
