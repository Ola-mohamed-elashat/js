<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link href="https://fonts.googleapis.com/css2?family=Cairo&family=Open+Sans&family=Roboto&display=swap"
    rel="stylesheet">

<body>
    <select id="font" title="choose font">
        <option>Open Sans</option>
        <option>Cairo</option>
        <option>Roboto</option>
    </select>
    <select id="color" title="choose color">
        <option>red</option>
        <option>black</option>
        <option>green</option>
        <option>blue</option>
        <option>orange</option>
        <option>Purple</option>
    </select>
    <select id="size" title="Choose Font Size">
        <option>16</option>
        <option>17</option>
        <option>18</option>
        <option>19</option>
        <option>20</option>
        <option>21</option>
        <option>22</option>
        <option>23</option>
        <option>24</option>
        <option>25</option>
        <option>26</option>
        <option>27</option>
        <option>28</option>
        <option>29</option>
        <option>30</option>
    </select>
    <p id="text">Welcome To Elzero</p>
    <!-- task2 -->
    <form>
        <input type="text" id="name" placeholder="Name">
        <input type="email" id="email" placeholder="Email">
        <input type="number" id="age" placeholder="Age">
        <select id="country">
            <option value="Egypt">Egypt</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="UAE">UAE</option>
            <option value="Qatar">Qatar</option>
            <option value="Kuwait">Kuwait</option>
        </select>
    </form>
    <script src="main.js"></script>
</body>

</html>
